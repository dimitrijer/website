<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Dimitrije's Website">
    <meta name="author" content="Dimitrije Radojević">

    <link rel="me" href="mailto:me@dimitrije.website">
    <link rel="stylesheet" type="text/css" href="/css/fonts.css" />
    <link rel="stylesheet" type="text/css" href="/css/style.css" />
    <link rel="stylesheet" type="text/css" href="/css/syntax.css" id="syntax-stylesheet" />
    <script>
        (function () {
            var saved = localStorage.getItem('theme');
            var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (dark) {
                document.documentElement.setAttribute('data-theme', 'dark');
                document.getElementById('syntax-stylesheet').href = '/css/syntax-dark.css';
            }
        })();
    </script>
    <link rel="canonical" href="$root$$url$" />
    <link rel="alternate" type="application/rss+xml" title="Dimitrije's Website" href="$root$/rss.xml">

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="@dradojevic" />
    <meta name="twitter:creator" content="@dradojevic" />
    $if(cover_image)$
    <meta name="twitter:image" content="$root$$cover_image$" />
    $endif$
    $if(og_description)$
    <meta property="og:url" content="$root$$url$" />
    <meta property="og:title" content="$title$" />
    <meta property="og:description" content="$og_description$" />
    <meta property="og:type" content="article" />
    $if(cover_image)$
    <meta property="og:image" content="$root$$cover_image$" />
    $endif$
    $endif$
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
    <link rel="manifest" href="/images/site.webmanifest">
    <link rel="mask-icon" href="/images/safari-pinned-tab.svg" color="#5bbad5">
    <link rel="shortcut icon" href="/images/favicon.ico">
    <meta name="msapplication-TileColor" content="#da532c">
    <meta name="msapplication-config" content="/images/browserconfig.xml">
    <meta name="theme-color" content="#fffffe">
    <title>$if(htmltitle)$$htmltitle$ - $endif$Dimitrije's Website</title>
</head>

<body>
    <header>
        $partial("templates/header.html")$
    </header>

    <main role="main">
        $body$
    </main>

    <footer>
        $partial("templates/footer.html")$
    </footer>

    <script>
        (function () {
            var root = document.documentElement;
            var syntaxLink = document.getElementById('syntax-stylesheet');
            var toggle = document.getElementById('theme-toggle');
            var media = window.matchMedia('(prefers-color-scheme: dark)');

            function isDark() {
                return root.getAttribute('data-theme') === 'dark';
            }

            function apply(dark) {
                if (dark) {
                    root.setAttribute('data-theme', 'dark');
                    syntaxLink.href = '/css/syntax-dark.css';
                } else {
                    root.removeAttribute('data-theme');
                    syntaxLink.href = '/css/syntax.css';
                }
                toggle.textContent = dark ? 'light' : 'dark';
            }

            apply(isDark());

            toggle.addEventListener('click', function (e) {
                e.preventDefault();
                var dark = !isDark();
                apply(dark);
                localStorage.setItem('theme', dark ? 'dark' : 'light');
            });

            media.addEventListener('change', function (e) {
                if (!localStorage.getItem('theme')) {
                    apply(e.matches);
                }
            });
        })();
    </script>
</body>

</html>
